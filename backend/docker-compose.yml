services:
  app:
    build: .
    container_name: nest_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The database name must match POSTGRES_DB below.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-marketplace}
      NODE_ENV: production
      # Mandatory secrets: the backend refuses to boot without a strong JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (32+ random chars)}
      JWT_ISSUER: ${JWT_ISSUER:-mero-bazaar-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mero-bazaar-web}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set (16+ random chars)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    # Never expose PostgreSQL to the host network in production; the app reaches
    # it over the private compose network only.
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
